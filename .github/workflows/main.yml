name: Saramin RPA Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
      
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: RPA 파이썬 스크립트 실행 (메일 발송)
      env:
        GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
      run: python main.py
