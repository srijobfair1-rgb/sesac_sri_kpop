name: Saramin RPA API

on:
  schedule:
    - cron: '15 0 * * *'  # 한국시간 매일 오전 09:15 (정각 피하기)
  push:                   # 커밋할 때도 스케줄러 강제 갱신
    branches: [ "main" ]
  workflow_dispatch:     # 수동 실행 버튼

jobs:
  run-api-notifier:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
      
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 사람인 API 호출 및 메일 발송
      env:
        GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
        SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
      run: python main.py
